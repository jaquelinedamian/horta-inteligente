{% extends 'base.html' %}{% load static %}{% block head %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>{% endblock %}{% block content %}<div class="page-header"><div><span class="eyebrow">Telemetria agregada</span><h1>Histórico</h1></div><div class="btn-group"><a class="btn btn-light" href="?days=1">Hoje</a><a class="btn btn-light" href="?days=7">7 dias</a><a class="btn btn-light" href="?days=30">30 dias</a></div></div><div class="content-card"><canvas id="historyChart" height="110"></canvas><p id="chartEmpty" class="empty-state d-none">Ainda não há leituras neste período.</p></div>{{ series|json_script:'history-data' }}{% endblock %}{% block scripts %}<script>const series=JSON.parse(document.getElementById('history-data').textContent);const labels={air_temperature:'Temperatura',air_humidity:'Umidade',air_pressure:'Pressão',water_level:'Reservatório'};const colors={air_temperature:'#d99a2b',air_humidity:'#3f8f5f',air_pressure:'#7a6aa8',water_level:'#4d8fc9'};if(Object.keys(series).length&&window.Chart){new Chart(document.getElementById('historyChart'),{type:'line',data:{datasets:Object.entries(series).map(([k,v])=>({label:labels[k],data:v,borderColor:colors[k],backgroundColor:colors[k]+'22',tension:.35,pointRadius:1}))},options:{parsing:false,responsive:true,scales:{x:{type:'linear',display:false}},plugins:{legend:{position:'bottom'}}}})}else{document.getElementById('historyChart').classList.add('d-none');document.getElementById('chartEmpty').classList.remove('d-none')}</script>{% endblock %}
