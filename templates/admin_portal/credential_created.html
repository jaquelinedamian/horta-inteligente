{% extends 'base.html' %}{% block area_name %}Administração operacional{% endblock %}{% block content %}<div class="page-header"><div><span class="eyebrow">Credencial criada</span><h1>{{ device.name }}</h1></div></div><div class="content-card" style="max-width:850px"><div class="alert alert-warning"><strong>Copie agora.</strong> Este token completo não poderá ser consultado novamente.</div><label class="form-label">Token do dispositivo</label><div class="input-group"><input class="form-control font-monospace" id="device-token" readonly value="{{ token }}"><button class="btn btn-outline-brand" type="button" onclick="navigator.clipboard.writeText(document.getElementById('device-token').value)">Copiar</button></div><a class="btn btn-brand mt-4" href="{% url 'ops-detail' 'devices' device.pk %}">Concluir</a></div>{% endblock %}
