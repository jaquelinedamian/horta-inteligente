{% extends 'base.html' %}{% block area_name %}Administração operacional{% endblock %}{% block content %}<div class="page-header"><div><span class="eyebrow">Credencial criada</span><h1>{{ device.name }}</h1></div></div><div class="content-card" style="max-width:850px"><div class="alert alert-warning"><strong>Copie este token agora. Ele não poderá ser exibido novamente.</strong></div><label class="form-label">Token do dispositivo</label><div class="input-group mb-4"><input class="form-control font-monospace" id="device-token" readonly value="{{ token }}"><button class="btn btn-outline-brand" type="button" onclick="navigator.clipboard.writeText(document.getElementById('device-token').value)">Copiar token</button></div><label class="form-label">Configuração para o firmware</label><textarea class="form-control font-monospace" id="firmware-config" rows="4" readonly>{% if firmware_config %}{{ firmware_config }}{% else %}#define DEVICE_ID "{{ device.id }}"
#define DEVICE_API_TOKEN "{{ token }}"{% endif %}</textarea><button class="btn btn-outline-brand mt-2" type="button" onclick="navigator.clipboard.writeText(document.getElementById('firmware-config').value)">Copiar configuração</button><div><a class="btn btn-brand mt-4" href="{% if garden %}{% url 'garden-detail' garden.pk %}{% else %}{% url 'ops-detail' 'devices' device.pk %}{% endif %}">Concluir</a></div></div>{% endblock %}
