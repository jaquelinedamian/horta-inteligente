{% extends 'base.html' %}{% block area_name %}Administração operacional{% endblock %}{% block content %}<div class="page-header"><div><span class="eyebrow">QR Code seguro</span><h1>{{ module.name }}</h1><p class="text-muted">{{ module.serial_number }}</p></div><button class="btn btn-light" onclick="window.print()">Imprimir</button></div><div class="content-card text-center" style="max-width:600px"><img class="img-fluid" width="360" height="360" alt="QR Code do módulo" src="data:image/png;base64,{{ qr_data }}"><code class="d-block my-3">{{ payload }}</code><p class="text-muted">O código contém somente o identificador interno do módulo.</p><a class="btn btn-brand" href="?download=1">Baixar PNG</a></div>{% endblock %}
